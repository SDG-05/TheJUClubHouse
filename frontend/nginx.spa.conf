server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Lab 6 Task 3: Helmet-equivalent security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: http://localhost:8000; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://localhost:8000;" always;

    # React Router SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Django Static & Media shared volume aliases (when mounted in docker-compose.prod.yml)
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
    }
}
